<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハムリハ</title>
<!--
  本体は app/ に移動した。
  iOSのホーム画面アプリがこのURLの古いHTMLを保持し続け、クエリを変えても
  Service Workerを入れても剥がせなかったため(2026-09-22)、キャッシュの存在
  しない新しいパスに逃がすのが唯一の確実な手段だった。
  このファイルは旧URLのブックマークを生かすためだけに残す。
-->
<script>location.replace('./app/' + location.search + location.hash);</script>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;line-height:1.7">
<p>🦵 ハムリハは <a href="./app/">こちら</a> に移動しました。</p>
</body>
</html>
